<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cactus Hill Raceway – Standings</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Banner -->
<header class="banner">
    <img src="images/logo.PNG" alt="Cactus Hill Logo" class="banner-logo">
    <div class="banner-content">
        <h1>Cactus Hill Raceway</h1>
        <h2>Season Standings</h2>
    </div>
</header>

<!-- Navbar -->
<nav class="navbar">
    <a href="index.html">Standings</a>
    <a href="results.html">Race Results</a>
    <a href="rules.html">Rules</a>
</nav>

<p class="updated">Last updated: 01/07/2026</p>

<!-- =================================================== -->
<!--  TABLE 1: POINTS STANDINGS                          -->
<!-- =================================================== -->
<div class="table-container">
    <h2 style="text-align:center; margin-top:0;">Season Points Standings</h2>

    <table class="leaderboard">
        <thead>
            <tr>
                <th>#</th>
                <th>Racer</th>
                <th>Points</th>
                <th>Event Wins</th>
                <th>Δ</th>
            </tr>
        </thead>
        <tbody id="standings-body"></tbody>
    </table>
</div>

<!-- =================================================== -->
<!--  TABLE 2: RACE STATS                                -->
<!-- =================================================== -->
<div class="table-container" style="margin-top: 35px;">
    <h2 style="text-align:center; margin-top:0;">Season Race Stats</h2>

    <table class="leaderboard">
        <thead>
            <tr>
                <th>Racer</th>
                <th>Races Attended</th>
                <th>Round Wins</th>
                <th>Event Wins</th>
            </tr>
        </thead>
        <tbody id="stats-body"></tbody>
    </table>
</div>

<!-- =================================================== -->
<!--  SCRIPTS                                            -->
<!-- =================================================== -->
<script>
/*
=========================================================
EDIT THIS SECTION ONLY DURING THE SEASON ✅
- Add/remove drivers
- Update attended / roundWins / eventWins / points
=========================================================
*/
const drivers = [
    { name: "Paul",    attended: 0, roundWins: 0, eventWins: 0, points: 0 },
    { name: "Andy",    attended: 0, roundWins: 0, eventWins: 0, points: 0 },
    { name: "Scotty",  attended: 0, roundWins: 0, eventWins: 0, points: 0 },
    { name: "Kitzy",   attended: 0, roundWins: 0, eventWins: 0, points: 0 },
    { name: "Maples",  attended: 0,  roundWins: 0, eventWins: 0, points: 0 },
    { name: "Braidyn", attended: 0,  roundWins: 0, eventWins: 0, points: 0 },
    { name: "Conor",   attended: 0, roundWins: 0, eventWins: 0, points: 0 },
    { name: "Matt",    attended: 0,  roundWins: 0, eventWins: 0, points: 0 },
    { name: "Joey",    attended: 0, roundWins: 0, eventWins: 0, points: 0 }
];

/*
=========================================================
OPTIONAL: Δ MOVEMENT TRACKING
- Put last update’s ORDERED standings snapshot here.
- You only need name + points + eventWins (for tie-break).
- If you don’t care about Δ, set previousStandings = [].
=========================================================
*/
const previousStandings =[
    //{ name: "Paul",    attended: 0, roundWins: 0, eventWins: 0, points: 0 },
    //{ name: "Andy",    attended: 0, roundWins: 0, eventWins: 0, points: 0 },
    //{ name: "Scotty",  attended: 0, roundWins: 0, eventWins: 0, points: 0 },
    //{ name: "Kitzy",   attended: 0, roundWins: 0, eventWins: 0, points: 0 },
    //{ name: "Maples",  attended: 0,  roundWins: 0, eventWins: 0, points: 0 },
    //{ name: "Braidyn", attended: 0,  roundWins: 0, eventWins: 0, points: 0 },
    //{ name: "Conor",   attended: 0, roundWins: 0, eventWins: 0, points: 0 },
    //{ name: "Matt",    attended: 0,  roundWins: 0, eventWins: 0, points: 0 },
    //{ name: "Joey",    attended: 0, roundWins: 0, eventWins: 0, points: 0 }
];

// ===================================================
// Build CURRENT standings from drivers list
// ===================================================
const currentStandings = drivers.map(d => ({
    name: d.name,
    points: d.points,
    eventWins: d.eventWins
}));

// Sort standings: Points desc, then Event Wins desc, then Name asc
currentStandings.sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    if (b.eventWins !== a.eventWins) return b.eventWins - a.eventWins;
    return a.name.localeCompare(b.name);
});

// Assign positions
currentStandings.forEach((r, i) => r.position = i + 1);

// Δ movement (based on position change)
currentStandings.forEach(r => {
    if (!previousStandings || previousStandings.length === 0) {
        r.delta = "—";
        return;
    }

    const oldIndex = previousStandings.findIndex(x => x.name === r.name);
    if (oldIndex === -1) {
        r.delta = "NEW";
        return;
    }

    const oldPos = oldIndex + 1;
    const newPos = r.position;

    if (newPos < oldPos) r.delta = "+" + (oldPos - newPos);
    else if (newPos > oldPos) r.delta = "-" + (newPos - oldPos);
    else r.delta = "0";
});

// Render standings table
const standingsBody = document.getElementById("standings-body");

currentStandings.forEach(r => {
    let deltaDisplay = r.delta;

    if (r.delta && r.delta.startsWith("+")) {
        deltaDisplay = `<span style="color:#0A8A0A;font-weight:bold">${r.delta}</span>`;
    } else if (r.delta && r.delta.startsWith("-")) {
        deltaDisplay = `<span style="color:#C40000;font-weight:bold">${r.delta}</span>`;
    } else if (r.delta === "NEW") {
        deltaDisplay = `<span style="color:#D4A017;font-weight:bold">NEW</span>`;
    } else if (r.delta === "0") {
        deltaDisplay = `<span style="color:#777">0</span>`;
    } else {
        deltaDisplay = `<span style="color:#777">—</span>`;
    }

    const row = document.createElement("tr");
    row.innerHTML = `
        <td>${r.position}</td>
        <td>${r.name}</td>
        <td>${r.points}</td>
        <td>${r.eventWins}</td>
        <td>${deltaDisplay}</td>
    `;
    standingsBody.appendChild(row);
});

// ===================================================
// Render stats table (sort by attended desc, then name)
// ===================================================
const statsBody = document.getElementById("stats-body");

const statsSorted = [...drivers].sort((a, b) => {
    if (b.attended !== a.attended) return b.attended - a.attended;
    return a.name.localeCompare(b.name);
});

statsSorted.forEach(d => {
    const row = document.createElement("tr");
    row.innerHTML = `
        <td>${d.name}</td>
        <td>${d.attended}</td>
        <td>${d.roundWins}</td>
        <td>${d.eventWins}</td>
    `;
    statsBody.appendChild(row);
});
</script>

</body>
</html>
