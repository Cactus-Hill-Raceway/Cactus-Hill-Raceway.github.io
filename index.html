<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cactus Hill Raceway – Standings</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Banner -->
<header class="banner">
    <img src="images/logo.PNG" alt="Cactus Hill Logo" class="banner-logo">
    <div class="banner-content">
        <h1>Cactus Hill Raceway</h1>
        <h2>Season Standings</h2>
    </div>
</header>

<!-- Navbar -->
<nav class="navbar">
    <a href="index.html">Standings</a>
    <a href="results.html">Race Results</a>
    <a href="rules.html">Rules</a>
</nav>

<p class="updated">Last updated: 01/29/2026</p>

<!-- =================================================== -->
<!--  TABLE 1: POINTS STANDINGS                          -->
<!-- =================================================== -->
<div class="table-container">
    <h2 style="text-align:center; margin-top:0;">Season Points Standings</h2>

    <table class="leaderboard">
        <thead>
            <tr>
                <th>#</th>
                <th>Racer</th>
                <th>Points</th>
                <th>Wins</th>
                <th>Δ</th>
            </tr>
        </thead>
        <tbody id="standings-body"></tbody>
    </table>
</div>

<!-- =================================================== -->
<!--  TABLE 2: SEASON RACE STATS                         -->
<!-- =================================================== -->
<div class="table-container" style="margin-top: 35px;">
    <h2 style="text-align:center; margin-top:0;">Season Race Stats</h2>

    <table class="leaderboard">
        <thead>
            <tr>
                <th>Racer</th>
                <th>Races Attended</th>
                <th>Semis</th>
                <th>2nd Place</th>
                <th>Wins</th>
            </tr>
        </thead>
        <tbody id="stats-body"></tbody>
    </table>
</div>

<script>
/*
=========================================================
POINTS SETTINGS (EDIT HERE IF RULES CHANGE)
=========================================================
*/
const SEMIS_PTS = 10;
const SECOND_PTS = 15;
const WIN_PTS = 20;

/*
=========================================================
EDIT THIS SECTION ONLY DURING THE SEASON ✅
- Add/remove drivers
- Update attended / semis / second / wins
=========================================================
*/
const drivers = [
    { name: "Paul",    attended: 4, semis: 2, second: 0, wins: 0 },
    { name: "Andy",    attended: 2, semis: 0, second: 0, wins: 0 },
    { name: "Scotty",  attended: 3, semis: 1, second: 1, wins: 0 },
    { name: "Kitzy",   attended: 4, semis: 1, second: 0, wins: 0 },
    { name: "Maples",  attended: 4, semis: 3, second: 0, wins: 1 },
    { name: "Braidyn", attended: 2, semis: 0, second: 1, wins: 0 },
    { name: "Conor",   attended: 4, semis: 0, second: 1, wins: 2 },
    { name: "Matt",    attended: 2, semis: 0, second: 0, wins: 0 },
    { name: "Joey",    attended: 4, semis: 0, second: 0, wins: 1 },
    { name: "Bob",    attended: 3, semis: 0, second: 0, wins: 0 },
    { name: "Nick",    attended: 2, semis: 0, second: 1, wins: 0 },
    { name: "Wally",    attended: 0, semis: 0, second: 0, wins: 0 }
];

/*
=========================================================
OPTIONAL: Δ MOVEMENT TRACKING
- Paste LAST UPDATE'S *sorted standings snapshot* here.
- If you don’t care about Δ, leave it as [] and it’ll show "—".
=========================================================
*/
const previousStandings = [
    { name: "Paul",    attended: 3, semis: 2, second: 0, wins: 0 },
    { name: "Andy",    attended: 2, semis: 0, second: 0, wins: 0 },
    { name: "Scotty",  attended: 2, semis: 0, second: 1, wins: 0 },
    { name: "Kitzy",   attended: 3, semis: 0, second: 0, wins: 0 },
    { name: "Maples",  attended: 3, semis: 3, second: 0, wins: 0 },
    { name: "Braidyn", attended: 2, semis: 0, second: 1, wins: 0 },
    { name: "Conor",   attended: 3, semis: 0, second: 1, wins: 2 },
    { name: "Matt",    attended: 1, semis: 0, second: 0, wins: 0 },
    { name: "Joey",    attended: 3, semis: 0, second: 0, wins: 1 },
    { name: "Bob",    attended: 3, semis: 0, second: 0, wins: 0 },
    { name: "Nick",    attended: 1, semis: 0, second: 0, wins: 0 },
    { name: "Wally",    attended: 0, semis: 0, second: 0, wins: 0 }
];
/*
=========================================================
AUTO-CALCULATE POINTS ✅
points = semis*10 + second*15 + wins*20
=========================================================
*/
drivers.forEach(d => {
    d.points = (d.semis * SEMIS_PTS) + (d.second * SECOND_PTS) + (d.wins * WIN_PTS);
});

/*
=========================================================
BUILD & SORT CURRENT STANDINGS
Sort: points desc, then wins desc, then name asc
=========================================================
*/
const currentStandings = drivers.map(d => ({
    name: d.name,
    points: d.points,
    wins: d.wins
}));

currentStandings.sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    if (b.wins !== a.wins) return b.wins - a.wins;
    return a.name.localeCompare(b.name);
});

currentStandings.forEach((r, i) => r.position = i + 1);

/*
=========================================================
Δ MOVEMENT (position change)
=========================================================
*/
currentStandings.forEach(r => {
    if (!previousStandings || previousStandings.length === 0) {
        r.delta = "—";
        return;
    }

    const oldIndex = previousStandings.findIndex(x => x.name === r.name);
    if (oldIndex === -1) {
        r.delta = "NEW";
        return;
    }

    const oldPos = oldIndex + 1;
    const newPos = r.position;

    if (newPos < oldPos) r.delta = "+" + (oldPos - newPos);
    else if (newPos > oldPos) r.delta = "-" + (newPos - oldPos);
    else r.delta = "0";
});

/*
=========================================================
RENDER STANDINGS TABLE
=========================================================
*/
const standingsBody = document.getElementById("standings-body");

currentStandings.forEach(r => {
    let deltaDisplay = r.delta;

    if (r.delta && r.delta.startsWith("+")) {
        deltaDisplay = `<span style="color:#0A8A0A;font-weight:bold">${r.delta}</span>`;
    } else if (r.delta && r.delta.startsWith("-")) {
        deltaDisplay = `<span style="color:#C40000;font-weight:bold">${r.delta}</span>`;
    } else if (r.delta === "NEW") {
        deltaDisplay = `<span style="color:#D4A017;font-weight:bold">NEW</span>`;
    } else if (r.delta === "0") {
        deltaDisplay = `<span style="color:#777">0</span>`;
    } else {
        deltaDisplay = `<span style="color:#777">—</span>`;
    }

    const row = document.createElement("tr");
    row.innerHTML = `
        <td>${r.position}</td>
        <td>${r.name}</td>
        <td>${r.points}</td>
        <td>${r.wins}</td>
        <td>${deltaDisplay}</td>
    `;
    standingsBody.appendChild(row);
});

/*
=========================================================
RENDER STATS TABLE
Sort: attended desc, then wins desc, then name asc
=========================================================
*/
const statsBody = document.getElementById("stats-body");

const statsSorted = [...drivers].sort((a, b) => {
    if (b.attended !== a.attended) return b.attended - a.attended;
    if (b.wins !== a.wins) return b.wins - a.wins;
    return a.name.localeCompare(b.name);
});

statsSorted.forEach(d => {
    const row = document.createElement("tr");
    row.innerHTML = `
        <td>${d.name}</td>
        <td>${d.attended}</td>
        <td>${d.semis}</td>
        <td>${d.second}</td>
        <td>${d.wins}</td>
    `;
    statsBody.appendChild(row);
});
</script>

</body>
</html>
