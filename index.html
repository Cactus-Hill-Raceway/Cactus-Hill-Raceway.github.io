<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cactus Hill Raceway – Standings</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- CSV Parser -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body>

<!-- Banner -->
<header class="banner">
    <img src="images/logo.PNG" alt="Cactus Hill Logo" class="banner-logo">

    <div class="banner-content">
        <h1>Cactus Hill Raceway</h1>
        <h2>Season Standings</h2>
    </div>
</header>

<!-- Navbar -->
<nav class="navbar">
    <a href="index.html">Standings</a>
    <a href="results.html">Race Results</a>
    <a href="rules.html">Rules</a>
</nav>

<p class="updated">Loading race data...</p>

<!-- =================================================== -->
<!-- POINTS STANDINGS                                    -->
<!-- =================================================== -->

<div class="table-container">

    <h2 style="text-align:center; margin-top:0;">
        Season Points Standings
    </h2>

    <table class="leaderboard">

        <thead>
            <tr>
                <th>#</th>
                <th>Racer</th>
                <th>Points</th>
                <th>Wins</th>
            </tr>
        </thead>

        <tbody id="standings-body"></tbody>

    </table>

</div>


<!-- =================================================== -->
<!-- SEASON RACE STATS                                   -->
<!-- =================================================== -->

<div class="table-container" style="margin-top:35px;">

    <h2 style="text-align:center; margin-top:0;">
        Season Race Stats
    </h2>

    <table class="leaderboard">

        <thead>
            <tr>
                <th>Racer</th>
                <th>Races Attended</th>
                <th>Semis</th>
                <th>2nd Place</th>
                <th>Wins</th>
            </tr>
        </thead>

        <tbody id="stats-body"></tbody>

    </table>

</div>


<script>

/*
=========================================================
CACTUS HILL RACEWAY
AUTOMATIC STANDINGS SYSTEM
=========================================================
*/


// ======================================================
// ACTIVE SEASON
// ======================================================

const ACTIVE_SEASON = 2026;


// ======================================================
// POINT VALUES
// ======================================================

const SEMI_POINTS = 10;
const SECOND_POINTS = 15;
const WIN_POINTS = 20;


// ======================================================
// GOOGLE SHEET URLS
// ======================================================

// New races submitted through Google Form

const RACE_DATA_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTno2jm6fy4iROcsMtCt66-7AB8zP_xyMthboS718T6Yq_FlnCg9IJO1P1KX0auZhdsjF2VFP0Ypo4H/pub?gid=118158032&single=true&output=csv";


// 2026 totals from BEFORE switching to Google Forms

const STARTING_TOTALS_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTno2jm6fy4iROcsMtCt66-7AB8zP_xyMthboS718T6Yq_FlnCg9IJO1P1KX0auZhdsjF2VFP0Ypo4H/pub?gid=1110429940&single=true&output=csv";


// ======================================================
// SPLIT GOOGLE FORM CHECKBOX RESPONSES
// ======================================================

function splitNames(value) {

    if (!value) {
        return [];
    }

    return value
        .split(",")
        .map(name => name.trim())
        .filter(name => name !== "");
}


// ======================================================
// CREATE RACER IF THEY DO NOT ALREADY EXIST
// ======================================================

function ensureDriver(drivers, name) {

    if (!name) {
        return;
    }

    if (!drivers[name]) {

        drivers[name] = {

            name: name,
            attended: 0,
            semis: 0,
            second: 0,
            wins: 0,
            points: 0

        };

    }
}


// ======================================================
// LOAD CSV FILE
// ======================================================

function loadCSV(url) {

    return new Promise((resolve, reject) => {

        Papa.parse(url, {

            download: true,
            header: true,
            skipEmptyLines: true,

            complete: function(results) {
                resolve(results.data);
            },

            error: function(error) {
                reject(error);
            }

        });

    });

}


// ======================================================
// BUILD STANDINGS
// ======================================================

async function buildStandings() {

    try {

        /*
        --------------------------------------------------
        LOAD BOTH GOOGLE SHEETS
        --------------------------------------------------
        */

        const [
            startingTotals,
            raceResponses
        ] = await Promise.all([

            loadCSV(STARTING_TOTALS_URL),
            loadCSV(RACE_DATA_URL)

        ]);


        const drivers = {};


        /*
        --------------------------------------------------
        LOAD 2026 STARTING TOTALS
        --------------------------------------------------
        */

        startingTotals.forEach(row => {

            const name =
                (row["Racer"] || "").trim();

            if (!name) {
                return;
            }

            ensureDriver(drivers, name);


            drivers[name].attended =
                Number(row["Races Attended"]) || 0;

            drivers[name].semis =
                Number(row["Semis"]) || 0;

            drivers[name].second =
                Number(row["2nd Place"]) || 0;

            drivers[name].wins =
                Number(row["Wins"]) || 0;


            /*
            Starting points are calculated automatically
            from the historical stats.
            */

            drivers[name].points =
                (drivers[name].semis * SEMI_POINTS) +
                (drivers[name].second * SECOND_POINTS) +
                (drivers[name].wins * WIN_POINTS);

        });


        /*
        --------------------------------------------------
        FILTER FORM RESPONSES TO 2026
        --------------------------------------------------
        */

        const seasonRaces = raceResponses.filter(row => {

            return Number(row["Season"]) === ACTIVE_SEASON;

        });


        /*
        --------------------------------------------------
        PROCESS EVERY NEW RACE
        --------------------------------------------------
        */

        seasonRaces.forEach(race => {

            const attending =
                splitNames(race["Racers Attending"]);

            const semiFinishers =
                splitNames(race["Semi - Final Finishers"]);

            const secondPlace =
                (race["Second Place"] || "").trim();

            const winner =
                (race["Race Winner"] || "").trim();


            /*
            ----------------------------------------------
            ATTENDANCE
            ----------------------------------------------
            */

            attending.forEach(name => {

                ensureDriver(drivers, name);

                drivers[name].attended++;

            });


            /*
            ----------------------------------------------
            SEMI-FINAL FINISHERS

            These should ONLY be racers eliminated
            in the semifinal round.
            ----------------------------------------------
            */

            semiFinishers.forEach(name => {

                ensureDriver(drivers, name);

                drivers[name].semis++;

                drivers[name].points += SEMI_POINTS;

            });


            /*
            ----------------------------------------------
            SECOND PLACE
            ----------------------------------------------
            */

            if (secondPlace) {

                ensureDriver(drivers, secondPlace);

                drivers[secondPlace].second++;

                drivers[secondPlace].points += SECOND_POINTS;

            }


            /*
            ----------------------------------------------
            RACE WINNER
            ----------------------------------------------
            */

            if (winner) {

                ensureDriver(drivers, winner);

                drivers[winner].wins++;

                drivers[winner].points += WIN_POINTS;

            }

        });


        /*
        --------------------------------------------------
        CONVERT RACER OBJECT TO ARRAY
        --------------------------------------------------
        */

        const standings =
            Object.values(drivers);


        /*
        --------------------------------------------------
        SORT POINT STANDINGS

        1. Points
        2. Wins
        3. Second-place finishes
        4. Semi finishes
        5. Name
        --------------------------------------------------
        */

        standings.sort((a, b) => {

            if (b.points !== a.points) {
                return b.points - a.points;
            }

            if (b.wins !== a.wins) {
                return b.wins - a.wins;
            }

            if (b.second !== a.second) {
                return b.second - a.second;
            }

            if (b.semis !== a.semis) {
                return b.semis - a.semis;
            }

            return a.name.localeCompare(b.name);

        });


        /*
        --------------------------------------------------
        ASSIGN POSITIONS
        --------------------------------------------------
        */

        standings.forEach((driver, index) => {

            driver.position = index + 1;

        });


        /*
        --------------------------------------------------
        BUILD POINT STANDINGS TABLE
        --------------------------------------------------
        */

        const standingsBody =
            document.getElementById("standings-body");

        standingsBody.innerHTML = "";


        standings.forEach(driver => {

            const row =
                document.createElement("tr");

            row.innerHTML = `

                <td>${driver.position}</td>

                <td>${driver.name}</td>

                <td>${driver.points}</td>

                <td>${driver.wins}</td>

            `;

            standingsBody.appendChild(row);

        });


        /*
        --------------------------------------------------
        BUILD SEASON STATS TABLE
        --------------------------------------------------
        */

        const statsBody =
            document.getElementById("stats-body");

        statsBody.innerHTML = "";


        /*
        Keep the stats table in points-standing order.
        */

        standings.forEach(driver => {

            const row =
                document.createElement("tr");

            row.innerHTML = `

                <td>${driver.name}</td>

                <td>${driver.attended}</td>

                <td>${driver.semis}</td>

                <td>${driver.second}</td>

                <td>${driver.wins}</td>

            `;

            statsBody.appendChild(row);

        });


        /*
        --------------------------------------------------
        LAST UPDATED DATE
        --------------------------------------------------
        */

        const updatedElement =
            document.querySelector(".updated");


        if (seasonRaces.length > 0) {

            const latestRace =
                seasonRaces[seasonRaces.length - 1];

            if (latestRace["Race Date"]) {

                updatedElement.textContent =
                    "Last updated: " +
                    latestRace["Race Date"];

            }

        }

        else {

            updatedElement.textContent =
                "2026 Season Standings";

        }

    }


    /*
    ------------------------------------------------------
    ERROR HANDLING
    ------------------------------------------------------
    */

    catch (error) {

        console.error(
            "Unable to load race data:",
            error
        );


        document.querySelector(".updated").textContent =
            "Unable to load race data.";

    }

}


// ======================================================
// START WEBSITE
// ======================================================

buildStandings();

</script>

</body>
</html>
